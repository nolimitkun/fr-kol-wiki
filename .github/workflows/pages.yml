name: Check and deploy MkDocs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check wiki
        run: uv run scripts/lint.py

      - name: Assemble docs
        run: |
          mkdir _docs
          cp README.md _docs/index.md
          cp SCHEMA.md watchlist.yaml _docs/
          cp -r wiki sources _docs/
          uv run scripts/gen_nav.py

      - name: Build site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: >-
          uv run
          --with 'mkdocs>=1.6,<2'
          --with 'mkdocs-material>=9,<10'
          --with 'mkdocs-literate-nav>=0.6,<1'
          mkdocs build --strict

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
