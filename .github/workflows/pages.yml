name: Deploy MkDocs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check wiki
        run: uv run scripts/lint.py
      - name: Assemble docs
        run: |
          mkdir _docs
          cp README.md _docs/index.md
          cp SCHEMA.md watchlist.yaml _docs/
          cp -r wiki sources _docs/
          uv run scripts/gen_nav.py
      - name: Build
        run: uv run --with mkdocs-material --with mkdocs-literate-nav mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
